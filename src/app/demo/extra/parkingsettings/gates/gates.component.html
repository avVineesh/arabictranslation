<div class="container-fluid head">
  <a style="cursor: pointer;" [routerLink]="['/admin/parkingsettings/boombarrier']"><i style="color: #1e90ff"
      class="fas fa-arrow-left fa-2x"></i></a>

</div>

<div class="row">
    <div class="col-xl-12">
      <button type="button" class="btn btn-icon btn-rounded btn-primary" data-toggle="modal"
        (click)="addGate(add)"><i class="feather icon-plus"></i></button>
      <app-card cardTitle="Gates Details" [options]="false" blockClass="table-border-style">
        <div class="table-responsive">
          <table class="table table-hover" id="mytable">
            <thead>
              <tr>
  
                <th>Device Id</th>
                <th>Device Name</th>
                <th>Gate Name</th>
                <th>Created Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of gatedata;let i=index">
  
                <td>{{data.gate_id}}</td>
                <td>{{data.boombarriername}}</td>
                <td>{{data.name}}</td>
                <td>{{data.createddate| date:'dd-MMM-yyy'}}</td>
                <td *ngIf="data.isactive==1"><label class="switch">
                    <input type="checkbox" [checked]="data.isactive==1" (click)="changeStatus(data)" />
                    <span class="slider round"></span> </label></td>
                <td *ngIf="data.isactive==0"><label class="switch">
                    <input type="checkbox" [checked]="data.isactive==1" (click)="changeStatus(data)" />
                    <span class="slider round"></span> </label></td>
  
              </tr>
            </tbody>
          </table>
        </div>
      </app-card>
    </div>
    <ngx-spinner type="ball-scale-multiple"></ngx-spinner>
  </div>

  <ng-template #add let-modal>
    <div class="modal-header">
      <h5 class="modal-title h4" id="myLargeModalLabel">Add Boombarrier Gates</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.close('Close click')" (click)="resetform()"></button>
    </div>
    <div class="modal-body">
        <form action="javascript:" #form="ngForm" autocomplete="off">
            <!-- <div class="form_group">
              <label class="required">Gate Type</label>
              <select class="select2_demo_1 form-control" style="width: 100%" name="type" required [(ngModel)]="gateservice.gatedata.type">
                <option value="" disabled selected>Select Gate Type</option>
                <option value="Entry">Entry</option>
                <option value="Exit">Exit</option>
              </select>
            </div> -->
            <div class="form-group">
              <label for="name" class="required">Gate Name</label>
              <input type="text" class="form-control" placeholder="Device Name"
                [ngClass]="{'is-invalid': !name.valid && name.errors.pattern}" ngModel #name="ngModel" [(ngModel)]="gateservice.gatedata.name"
                pattern="[a-zA-Z ]*$" required name="name">
              <label *ngIf="!name.valid && name.errors.pattern"
                class="error jquery-validation-error small form-text invalid-feedback">Please enter a valid device name
                .</label>
            </div>
            <button type="button" class="btn btn-secondary me-2 mb-2" data-dismiss="modal" (click)="modal.close('Close click')"
              (click)="resetform()">Close</button>
            <button type="button" class="pull-left btn btn-primary pull-right me-2 mb-2" data-dismiss="modal" [disabled]="!form.valid"
            (click)="modal.close('Close click')" (click)="saveGateInfo()">Save</button>
          </form>
    </div>
  </ng-template>
