<!-- View list .......................-->
<div class="row">
    <div class="col-xl-12">
       
      <button  type="button" class="btn btn-primary"
        data-toggle="modal"  (click)="addModal(add)" >Add New</button>
      <app-card cardTitle="RF Reader Details" [options]="false" blockClass="table-border-style">
        <div class="table-responsive">
          <table class="table table-hover" id="mytable">
            <thead>
              <tr>
  
                <th>Plaza ID</th>
                <th>ParkingSpace</th>
                <th>Boombarrier</th>
                <th>Lane</th>
                 <th>MAC</th>
                 <th>Topic</th>
                <th>Created Date</th>
                <th>Status</th>
                <th>Edit</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of data;let i=index">
                <td>{{data.plazaid}}</td>
                <td>{{data.parking_lot_name}}</td>
                <td>{{data.boombarriername}}</td>
                <td>{{data.lane}}</td>
                <td>{{data.macid}}</td>
                <td>{{data.topic}}</td>
                <td>{{data.createddate| date:'dd-MMM-yyy'}}</td>
               
                 <td *ngIf="data.isactive==1"><label class="switch">
                    <input type="checkbox" [checked]="data.isactive==1" (click)="changeStatus(data)" />
                    <span class="slider round"></span> </label></td>
                <td *ngIf="data.isactive==0"><label class="switch">
                    <input type="checkbox" [checked]="data.isactive==1" (click)="changeStatus(data)" />
                    <span class="slider round"></span> </label></td>

                    <td ><a style="cursor: pointer;"
                    data-toggle="modal" (click)="getIndex(i)" (click)="editData(edit)"><i style="color: #1e90ff"
                      class="fas fa-pencil-alt" aria-hidden="true"></i></a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </app-card>
    </div>
    <ngx-spinner type="ball-scale-multiple"></ngx-spinner>
  </div>
  <!-- ........................ -->


   <!-- Add rf reader details -->
  <ng-template #add let-modal>
    <div class="modal-header">
      <h5 class="modal-title h4" id="myLargeModalLabel">Add RF Reader Details</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.close('Close click')" (click)="resetform()"></button>
    </div>
    <div class="modal-body">
        <form action="javascript:" #form="ngForm" autocomplete="off">
            <div class="form-group">
              <label for="plazaid" class="required">Plaza ID</label>
              <input type="text" class="form-control" placeholder="Plaza ID" pattern="^[0-9]+$"
                [ngClass]="{'is-invalid': !plazaid.valid && plazaid.errors.pattern}" ngModel #plazaid="ngModel" required
                name="plazaid" ngModel  maxlength="16" [(ngModel)]="service.reader.plazaid">
              <label *ngIf="!plazaid.valid && plazaid.errors.pattern"
                class="error jquery-validation-error small form-text invalid-feedback">Please enter a valid plazaid id
                .</label>
            </div>
             <div class="form_group">
              <label class="required">Parking Space</label>
              <select class="select2_demo_1 form-control" style="width: 100%" name="parking_lot_id" required
                [(ngModel)]="service.reader.parking_lot_id" (change)="getBoombarrierList()">
                <option value="" disabled selected>Select parking area</option>
                <option *ngFor="let value of parkingarea" [value]="value.parking_lot_id">{{value.parking_lot_name}}</option>
              </select>
            </div>
             <div class="form_group" >
              <label class="required">Boombarrier</label>
              <select class="select2_demo_1 form-control" style="width: 100%" name="deviceid"
                [(ngModel)]="service.reader.deviceid">
                <option value="" disabled selected>Select boombarrier</option>
                <option *ngFor="let data of boombarrierlist" [value]="data.deviceid">{{data.boombarriername}}</option>
              </select>
            </div>
            <div class="form-group">
              <label for="macid">MacID</label>
              <input type="text" class="form-control" placeholder="Mac ID" ngModel #macid="ngModel" name="macid" ngModel
                [(ngModel)]="service.reader.macid">
            </div>
            <div class="form-group">
              <label for="topic">Topic</label>
              <input type="text" class="form-control" placeholder="Topic" ngModel #topic="ngModel" name="topic"
                ngModel [(ngModel)]="service.reader.topic">
            </div>
            <div class="form-group">
              <label for="lane">Lane</label>
              <input type="text" class="form-control" placeholder="Lane" ngModel #Lane="ngModel" name="lane"
                ngModel [(ngModel)]="service.reader.lane">
            </div>
            <div class="app-modal-footer">
              <button type="button" class="btn btn-secondary me-2 mb-2" data-dismiss="modal" (click)="modal.close('Close click')"
                (click)="resetform()">Close</button>
              <button type="button" class="pull-left btn btn-primary pull-right mb-2" data-dismiss="modal" [disabled]="!form.valid"
              (click)="modal.close('Close click')" (click)="saveReader()">Save</button>
            </div>
      
          </form>
    </div>
  </ng-template>
  <!-- ................. -->


  <!-- Edit rfreader details......................................... -->
  <ng-template #edit let-modal>
    <div class="modal-header">
      <h5 class="modal-title h4" id="myLargeModalLabel">Edit RF Reader Details</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.close('Close click')" (click)="resetform()"></button>
    </div>
    <div class="modal-body" *ngFor="let editdata of dataindex">
        <form action="javascript:" #form="ngForm" autocomplete="off">
           <div class="form-group">
              <label for="plazaid" class="required">Plaza ID</label>
              <input type="text" class="form-control" placeholder="Plaza ID"
                [ngClass]="{'is-invalid': !plazaid.valid && plazaid.errors.pattern}" ngModel #plazaid="ngModel" required
                name="plazaid" ngModel  maxlength="16" [(ngModel)]="editdata.plazaid">
              <label *ngIf="!plazaid.valid && plazaid.errors.pattern"
                class="error jquery-validation-error small form-text invalid-feedback">Please enter a valid plazaid id
                .</label>
            </div>
             <div class="form_group">
              <label class="required">Parking Space</label>
              <select class="select2_demo_1 form-control" style="width: 100%" name="parking_lot_id" required
                [(ngModel)]="editdata.parking_lot_id" (change)="getparkingspaceid(editdata.parking_lot_id)">
                <option value="" disabled selected>Select parking area</option>
                <option *ngFor="let value of parkingarea" [value]="value.parking_lot_id">{{value.parking_lot_name}}</option>
              </select>
            </div>
             <div class="form_group" >
              <label class="required">Boombarrier</label>
              <select class="select2_demo_1 form-control" style="width: 100%" name="deviceid"
                [(ngModel)]="editdata.deviceid">
                <option value="" disabled selected>Select boombarrier</option>
                <option *ngFor="let data of boombarrierlist" [value]="data.deviceid">{{data.boombarriername}}</option>
              </select>
            </div>
            <div class="form-group">
              <label for="macid">MacID</label>
              <input type="text" class="form-control" placeholder="Mac ID" ngModel #macid="ngModel" name="macid" ngModel
                [(ngModel)]="editdata.macid">
            </div>
            <div class="form-group">
              <label for="topic">Topic</label>
              <input type="text" class="form-control" placeholder="Topic" ngModel #topic="ngModel" name="topic"
                ngModel [(ngModel)]="editdata.topic">
            </div>
            <div class="form-group">
              <label for="lane">Lane</label>
              <input type="text" class="form-control" placeholder="Lane" ngModel #Lane="ngModel" name="lane"
                ngModel [(ngModel)]="editdata.lane">
            </div>
            <button type="button" class="btn btn-secondary me-2 mb-2" data-dismiss="modal" (click)="modal.close('Close click')"
              (click)="getInfo()">Close</button>
            <button type="button" class="pull-left btn btn-primary pull-right mb-2" data-dismiss="modal" [disabled]="!form.valid"
            (click)="modal.close('Close click')" (click)="editReaderInfo(editdata)">Save</button>
          </form>
    </div>
  </ng-template>
