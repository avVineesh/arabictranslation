<div class="auth-wrapper">
    <div class="auth-content">
      <div class="auth-bg">
        <span class="r"></span>
        <span class="r s"></span>
        <span class="r s"></span>
        <span class="r"></span>
      </div>
      <div class="card">
        <div class="card-body text-center">
          <div class="mb-4">
            <i class="feather icon-unlock auth-icon"></i>
          </div>
          <h3 class="mb-4">ParKochi ADMIN PORTAL</h3>
          <form (ngSubmit)="onLogin()" #f="ngForm" ngNativeValidate autocomplete="off">
          <div class="input-group mb-3">
            <input type="text"  name="phonenumber" #phonenumber="ngModel" [ngClass]="{'is-invalid': !phonenumber.valid && phonenumber.touched && phonenumber.errors.pattern}" ngModel  required  class="form-control"     placeholder=" User Name">
            <label *ngIf="!phonenumber.valid && phonenumber.errors.pattern" class="error jquery-validation-error small form-text invalid-feedback" >Please enter a valid User Name.</label>
          </div>
          <div class="input-group mb-4">
            <input type="password" name="password" ngModel class="form-control" [ngClass]="{'is-invalid': !password.valid && password.touched && password.errors.pattern}" required #password="ngModel"     placeholder=" Password">
          <label *ngIf="!password.valid  && password.errors.pattern" class="error jquery-validation-error small form-text invalid-feedback">Please enter a valid password.</label>
          </div>
          <!-- <div class="form-group text-start">
            <div class="checkbox checkbox-fill d-inline">
              <input type="checkbox" name="checkbox-fill-1" id="checkbox-fill-a1" checked="" />
              <label for="checkbox-fill-a1" class="cr">Save Details</label>
            </div>
          </div> -->
          <button type="submit" class="btn btn-primary mb-4">Login</button>
        </form>
          <!-- <p class="mb-2 text-muted">
            Forgot password?
            <a [routerLink]="['/auth/reset-password']">Reset</a>
          </p> -->
          <!-- <p class="mb-0 text-muted">
            Don’t have an account?
            <a [routerLink]="['/auth/signup']">Sign up</a>
          </p> -->
        </div>
      </div>
    </div>
  </div>
