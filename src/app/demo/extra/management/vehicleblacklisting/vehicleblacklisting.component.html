<div class="row">
    <div class="col-xl-12">
      <button  type="button" class="btn btn-primary"
        data-toggle="modal" (click)=" addVehicle(add)" >Add New</button>
      <app-card cardTitle="Blacklisted Vehicle Details" [options]="false" blockClass="table-border-style">
        <div class="table-responsive">
          <table class="table table-hover" id="mytable">
            <thead>
              <tr>
                <th>Vehicle Number</th>
                <th>Vehicle Type</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
                <tr *ngFor="let data of vehicledata; let i=index">
                <td>{{data.vehiclenumber}}</td>
                <td>{{data.vehicletype}}</td>
                <td *ngIf="data.status==0" style="color: red;">Open</td>
                <td *ngIf="data.status==1" style="color: green;">Closed</td>
              </tr>
            </tbody>
          </table>
        </div>
      </app-card>
    </div>
    <ngx-spinner type="ball-scale-multiple"></ngx-spinner>
  </div>

  <ng-template #add let-modal>
    <div class="modal-header">
      <h5 class="modal-title h4" id="myLargeModalLabel">Add a vehicle into blacklist</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.close('Close click')" (click)="resetform()"></button>
    </div>
    <div class="modal-body">
        <form autocomplete="off" #f="ngForm">
            <div class="form-group">
              <label class="required">Vehicle Number</label>
              <input type="text" class="form-control" placeholder="KL01AX0009" name="vehiclenumber" ngModel #vehiclenumber="ngModel"
                [(ngModel)]="service.vehicledata.vehiclenumber" required>
      
            </div>
            <div class="form-group">
              <label class="required">Vehicle Type</label>
              <input type="text" class="form-control" placeholder="Car/Bike/Bus" name="vehicletype" ngModel #vehicletype="ngModel"
                [(ngModel)]="service.vehicledata.vehicletype" pattern="^(Car|Bike|Bus)$" [ngClass]="{'is-invalid': !vehicletype.valid && vehicletype.errors?.pattern}" 
                required>
      
                <label *ngIf="!vehicletype.valid && vehicletype.errors.pattern"
                class="error jquery-validation-error small form-text invalid-feedback">Please enter a valid vehicle type.</label>
            </div>
            
            <button type="button" class="btn btn-primary me-2 mb-2" data-dismiss="modal" (click)="modal.close('Close click')"
              [disabled]="!f.valid" (click)="saveVehicleDetails()">Save</button>
            <button type="button" class="btn btn-secondary mb-2" data-dismiss="modal" (click)="modal.close('Close click')"
              (click)="resetform()">Close</button>
      
          </form>
    </div>
  </ng-template>
