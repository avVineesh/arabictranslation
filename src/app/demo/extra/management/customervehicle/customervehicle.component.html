<div class="container-fluid head">
    <a style="cursor: pointer;" [routerLink]="['/admin/management/whitelistedvehicles']"><i style="color: #1e90ff"
        class="fas fa-arrow-left fa-2x"></i></a>
  
  </div>
<div class="row">
    <div class="col-xl-12">
      <div class="row">
        <div class="col-sm-3">
          <div class="form-group">
            
            
              <button type="button"   [ngStyle]="{'display' : custservice.edit === true ? 'block' : 'none' }"
            class="btn btn-primary" data-toggle="modal" (click)="addCustomerVeh(add)">Add</button>
          </div>
        </div>
      </div>
    <div class="row">
      <div class="col-xl-12">
        <app-card cardTitle="Vehicle Details" [options]="false" blockClass="table-border-style">
          <div class="table-responsive">
            <table class="table table-stripped" id="custvehicles">
              <thead>
                <tr>
                  <th>Vehicle Number</th>
                  <th>Vehicle Type</th>
                  <th>Segment</th>
                  <th>Default Vehicle(Yes/No)</th>
                  <th>Is owner</th>
                  <th>Status</th>
                  <th>Edit</th>
                </tr>
              </thead>
              <tbody >
                <tr *ngFor="let vehicledata of datas; let i=index">
                  <td>{{vehicledata.vehicleno}}</td>
                  <td>{{vehicledata.vehicletype}}</td>
                  <td>{{vehicledata.segmentname}}</td>
                  <td *ngIf="vehicledata.isprimary ==1">Yes</td>
                  <td *ngIf="vehicledata.isprimary ==0">No</td>
                  <td *ngIf="vehicledata.isowner==1"><label class="switch">
                      <input type="checkbox" [checked]="vehicledata.isowner==1" (click)="ownershipChange(vehicledata)" />
                      <span class="slider round"></span> </label></td>
                  <td *ngIf="vehicledata.isowner==0"><label class="switch">
                      <input type="checkbox" [checked]="vehicledata.isowner==1" (click)="ownershipChange(vehicledata)" />
                      <span class="slider round"></span> </label></td>
                  <!-- <td>{{vehicledata.ownerphone}}</td> -->
                  <td *ngIf="vehicledata.isdeleted==1"><label class="switch">
                    <input type="checkbox" [checked]="vehicledata.isdeleted==0" (click)="changeStatus(vehicledata)" />
                    <span class="slider round"></span> </label></td>
                <td *ngIf="vehicledata.isdeleted==0"><label class="switch">
                    <input type="checkbox" [checked]="vehicledata.isdeleted==0" (click)="changeStatus(vehicledata)" />
                    <span class="slider round"></span> </label></td>
                  <td><a style="cursor: pointer;" (click)="GetValueIndex(i)" (click)="segmentForEdit()"(click)="editModal(edit)"
                  data-toggle="modal"><i style="color: #1e90ff" class="fas fa-pencil-alt" aria-hidden="true"></i></a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </app-card>
      </div>
      <ngx-spinner type="ball-scale-multiple"></ngx-spinner>
    </div>
    </div>
  </div>


   <!-- Adding customer Vehicle Details -->
  <ng-template #add let-modal>
    <div class="modal-header">
      <h5 class="modal-title h4" id="myLargeModalLabel">Add Vehicle</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.close('Close click')" (click)="resetform()"></button>
    </div>
    <div class="modal-body">
        <form action="javascript:" #f="ngForm">
            <div class="form-group">
              <label class="required" for="inputvehno">Vehicle Number</label>
              <input type="text" class="form-control" name="vehicleno" placeholder="Vehicle Number" #vehno="ngModel"
              pattern="^[a-zA-Z0-9]*$" onkeyup="this.value = this.value.toUpperCase();"
                [ngClass]="{'is-invalid': !vehno.valid && vehno.errors.pattern}" [(ngModel)]="service.addvehicle.vehicleno"
                required>
              <label *ngIf="!vehno.valid && vehno.errors.pattern"
                class="error jquery-validation-error small form-text invalid-feedback">Please enter a valid Vehicle Number
                .</label>
    
            </div>
            <div class="form-group">
              <label class="required" for="inputvehmake">Vehicle Type</label>
              <select class="select2_demo_1 form-control" required style="width: 100%" name="vehimake" (change)="getSegment($event)"
                [(ngModel)]="service.addvehicle.vehicletype">
                <option value="" disabled selected>Choose a Vehicle Type</option>
                <option *ngFor="let vehdata of vehiclecat" [value]="vehdata.categoryname">{{vehdata.categoryname}}</option>
              </select>
              <!-- <input type="text" class="form-control" name="vehimake" placeholder="Vehicle Type"
            [(ngModel)]="service.addvehicle.vehicletype"> -->
            </div>
            <div class="form-group" *ngIf="showsegment">
              <label for="inputvehmake">Segment</label>
              <select class="select2_demo_1 form-control"  style="width: 100%" name="segment"
                [(ngModel)]="service.addvehicle.vehmake">
                <option value="" disabled selected>Choose a Segment</option>
                <option *ngFor="let segment of vehsegment" [value]="segment.segmentid">{{segment.segmentname}}</option>
              </select>
              <!-- <input type="text" class="form-control" name="segment" placeholder="Vehicle Make"
            [(ngModel)]="service.addvehicle.vehmake"> -->
            </div>
            <!-- <div class="form-group">
            <label for="inputvehmake">Vehicle Model</label>
            <input type="text" class="form-control" name="vehiclemodel" placeholder="Vehicle Model"
            [(ngModel)]="service.addvehicle.vehmodel">
          </div>
          <div class="form-group">
            <label for="inputvehmake">Vehicle Color</label>
            <input type="text" class="form-control" name="vehiclemodel" placeholder="Vehicle Color"
            [(ngModel)]="service.addvehicle.vehcolor">
          </div> -->

                <label for="radio-p-fill-6" class="cr">No</label>
              </div>
            </div>
          </div> -->

            <div class="form-group">
              <button type="button" class="btn btn-primary me-2 mb-2" data-dismiss="modal" (click)="onAdd()"
              (click)="modal.close('Close click')" [disabled]='!f.valid'>Save</button>

  <ng-template #edit let-modal>
    <div class="modal-header">
      <h5 class="modal-title h4" id="myLargeModalLabel">Edit Vehicle Details</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.close('Close click')" (click)="resetform()"></button>
    </div>
    <div class="modal-body" *ngFor="let data of vehicleindex">
        <form action="javascript:" #f1="ngForm">
            <div class="form-group">
              <label class="required" for="inputvehno">Vehicle Number</label>
              <input type="text" class="form-control" name="vehicleno" placeholder="Vehicle Number" #vehno="ngModel"
              pattern="^[a-zA-Z0-9]*$" onkeyup="this.value = this.value.toUpperCase();"
              [ngClass]="{'is-invalid': !vehno.valid && vehno.errors.pattern}"
                [(ngModel)]="data.vehicleno" required>
      
            </div>
            <div class="form-group">
              <label class="required" for="inputvehmake">Vehicle Type</label>
              <select class="select2_demo_1 form-control" required style="width: 100%" name="vehimake" (change)="getSegment($event)"
              [(ngModel)]="data.vehicletype">
                <option value="" disabled selected>Choose a Vehicle Type</option>
                <option *ngFor="let vehdata of vehiclecat" [value]="vehdata.categoryname">{{vehdata.categoryname}}</option>
              </select>
              <!-- <input type="text" class="form-control" name="vehimake" placeholder="Vehicle Type"
            [(ngModel)]="service.addvehicle.vehicletype"> -->
            </div>
            <div class="form-group" *ngIf="showsegment">
              <label for="segmentname">Segment</label>
              <select class="select2_demo_1 form-control"  style="width: 100%" name="segment"
              [(ngModel)]="data.segmentid">
                <option value="" disabled selected>Choose a Segment</option>
                <option *ngFor="let segment of vehsegment" [value]="segment.segmentid">{{segment.segmentname}}</option>
              </select>
      
            </div>
            <div class="form-group">
            <button type="button" class="btn btn-primary me-2 mb-2" data-dismiss="modal" (click)="OnUpdate(data)"
            (click)="modal.close('Close click')" [disabled]='!f1.valid'>Save</button>
              <button type="button" class="btn btn-secondary mb-2" data-dismiss="modal"
              (click)="modal.close('Close click')" (click)="onGet()">Close</button>
            </div>
            
          </form>
    </div>
  </ng-template>
